<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Maskan Estates</title>
<meta name="description" content="Property listings, calculators and Newsflash updates for plot owners and buyers in Pakistan.">
<!--SEO-HEAD-->
<!--SITE-DATA-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>
/* Layout: browser-frame mock. Preview bar on top, then a framed site (ticker, header, page, footer) or the admin console. */
:root{
  --bg:#f6faf7;--surface:#ffffff;--fg:#0f1917;--muted:#586864;--line:#dbe5df;--soft:#e8f1ec;
  --acc:#15803d;--acc-fg:#ffffff;--hot:#d9461f;--hot-fg:#ffffff;--ok:#1b7a3d;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body)}
*{box-sizing:border-box}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
.pv{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--font-body);padding:9px 14px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--acc);color:var(--acc-fg)}
.addr{flex:1 1 180px;min-width:0;font:12px var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.addr b{color:var(--fg);font-weight:500}
.pv-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.hint{margin:10px 0 12px;font-size:13px;color:var(--muted);max-width:75ch}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 12px;font:500 13px var(--font-body);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.warn{color:var(--hot)}
.btn.sm{padding:4px 8px;font-size:12px}
.up{position:relative;overflow:hidden}
.zbox{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.zrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zrow select{max-width:100%;font:13px var(--font-mono)}
.zmsg{font-size:13px;border-radius:8px;padding:10px 12px;border:1px solid var(--line);overflow-wrap:anywhere}
.zmsg.err{border-color:#c0392b;color:#c0392b}.zmsg.ok{border-color:var(--acc)}
.zbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.zbar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pz{border:1px dashed var(--acc);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);outline:0;min-height:44px;flex:1 1 100%}
.pz:focus{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);position:relative}

/* newsflash ticker */
.tick{display:flex;background:var(--fg);color:var(--bg);overflow:hidden;font-size:13px}
.tl{background:var(--hot);color:var(--hot-fg);padding:8px 12px;font:600 11px var(--font-mono);letter-spacing:.12em;flex:none;border:0;cursor:pointer}
.tm{flex:1;min-width:0;overflow:hidden}
.tt{display:inline-flex;white-space:nowrap;animation:mq var(--d,60s) linear infinite}
.tt:hover{animation-play-state:paused}
.tg{display:inline-flex;gap:44px;padding:8px 22px}
.tg button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
.tg button:hover{text-decoration:underline}
@keyframes mq{to{transform:translateX(-50%)}}
.ban{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--acc);color:var(--acc-fg);padding:9px 16px;font-size:14px}
.ban button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px}

/* header */
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);font:700 20px var(--font-display);cursor:pointer;padding:0}
.pzip{width:100%}.pzip iframe{width:100%;height:calc(100vh - 140px);min-height:560px;border:0;display:block;background:#fff}
.lg i.li{background:none;overflow:hidden;border-radius:50%}.lg i.li img{width:100%;height:100%;object-fit:cover;display:block}
.lg i{width:32px;height:32px;border-radius:8px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-style:normal;font-size:16px}
.nv{display:flex;gap:2px;align-items:center;margin-left:auto}
.nb{background:none;border:0;color:var(--fg);padding:8px 11px;border-radius:7px;font:500 14px var(--font-body);cursor:pointer}
.nb:hover,.nb[aria-current=page]{background:var(--soft)}
.nb[aria-current=page]{color:var(--acc);font-weight:600}
.dd{position:relative}
.dm{position:absolute;top:calc(100% + 4px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.dm .nb{display:block;width:100%;text-align:left}
.bellw{position:relative}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.bell sup{position:absolute;top:-6px;right:-6px;background:var(--hot);color:var(--hot-fg);font:600 10px var(--font-mono);border-radius:9px;padding:1px 5px}
.np{position:absolute;right:0;top:calc(100% + 6px);width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px}
.np h4{margin:6px 8px;font:600 12px var(--font-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.np p{margin:0;padding:8px;border-top:1px solid var(--line);font-size:13px}
.np time{display:block;font:11px var(--font-mono);color:var(--muted)}
.burger{display:none;margin-left:auto}

/* main */
.mn{padding:18px 16px 28px;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:24px}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:62ch}

/* hero */
.hero{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:2/1;background:var(--soft);max-width:100%;touch-action:pan-y}
.trk{display:flex;height:100%;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.sl{flex:0 0 100%;position:relative;height:100%}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.66));z-index:1;pointer-events:none}
.slk{position:absolute;inset:0;z-index:2;display:block;cursor:pointer}
.slk:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.cap h3{font-size:clamp(20px,3.4vw,34px);color:#fff}
.cap p{margin:4px 0 0;font-size:14px;opacity:.92}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer}
.ar.l{left:10px}.ar.r{right:10px}
.dots{position:absolute;right:16px;top:14px;display:flex;gap:6px}
.dot{width:22px;height:4px;border-radius:2px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0}
.dot[aria-current=true]{background:#fff}
.hmeta{position:absolute;left:16px;top:12px;font:500 11px var(--font-mono);color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:5px;letter-spacing:.04em}

/* tool grid: three boxes, large headings */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,148px),192px));gap:22px 18px;justify-content:start}
.tool{min-width:0}
.tool h3{font:700 24px/1.1 var(--font-display);letter-spacing:-.01em;margin:0 0 8px;padding:2px 0;border-radius:4px;overflow-wrap:anywhere}
.tool h3[contenteditable=true]{outline:1px dashed var(--acc);outline-offset:2px;background:var(--soft);cursor:text}
.tb{aspect-ratio:1;max-width:192px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tb iframe{width:100%;height:100%;border:0;display:block}
.tb{position:relative}
.tov{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;padding:0;cursor:pointer;z-index:2;display:flex;align-items:flex-end;justify-content:flex-end}
.tov span{margin:6px;background:var(--acc);color:var(--acc-fg);font:600 11px var(--font-body);padding:4px 9px;border-radius:999px;opacity:.92}
.tov:hover{box-shadow:inset 0 0 0 2px var(--acc);border-radius:10px}
.tool h3[data-act]{cursor:pointer}
.tool h3[data-act]:hover{color:var(--acc);text-decoration:underline;text-underline-offset:4px}
.flip{perspective:900px;width:100%;aspect-ratio:1;max-width:192px;cursor:pointer;outline:0}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.ff,.fb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;overflow:hidden}
.ff{background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#000));color:var(--acc-fg);flex-direction:column;gap:8px}
.ff::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.flip .ff h3{margin:0;padding:2px 4px;font:700 24px/1.12 var(--font-display);color:inherit;position:relative;z-index:1;overflow-wrap:anywhere}
.flip .ff h3[contenteditable=true]{outline:1px dashed var(--acc-fg);background:rgba(255,255,255,.14);cursor:text}
.fb{background:var(--fg);color:var(--bg);transform:rotateX(180deg);flex-direction:column;gap:4px}
.fb b{font:700 44px/1 var(--font-display);letter-spacing:.02em}
.fb span{font:500 26px/1 var(--font-body)}
@media (hover:hover){.flip[data-act]:hover .fi,.flip[data-act]:focus-visible .fi{transform:rotateX(180deg)}}
.flip[data-act]:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion:reduce){.fi{transition:none}}
.tfull{position:fixed;inset:0;z-index:50;background:var(--surface);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tfbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.tfbar h1{font:700 20px var(--font-display);margin:0;flex:1;min-width:120px}
.tfbar .tmore{margin-left:auto}
.tdis{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--muted);background:var(--surface)}
.tdis b{color:var(--fg)}
.tfull iframe{flex:1;width:100%;min-height:0;border:0;display:block}
.tpg{display:flex;flex-direction:column;gap:16px;max-width:760px}
.tpg h1{font:700 34px/1.1 var(--font-display);margin:0}
.tbig{width:100%;height:min(70vh,560px);min-height:360px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tbig iframe{width:100%;height:100%;border:0;display:block}
.tmore{display:flex;gap:8px;flex-wrap:wrap}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tag{font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.06em}

/* newsflash cards and articles */
.nl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.nc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:0;min-width:0}
.ni{display:block;aspect-ratio:2/1;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));overflow:hidden}
.ni img{width:100%;height:100%;object-fit:cover;display:block}
.ni.ph{display:flex;align-items:center;justify-content:center;color:var(--acc-fg);font:700 26px var(--font-display)}
.nbd{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.aimg{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer}
.pdfv{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#savebar:empty{display:none}
.sb{pointer-events:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:780px}
.sb.dirty{border-left:6px solid var(--hot)}
.sb.ok{border-left:6px solid var(--acc)}
.sb .note{color:inherit;opacity:.75}
.nc:hover{border-color:var(--acc)}
a.nc{text-decoration:none}
.sl video{width:100%;height:100%;object-fit:cover;display:block;background:var(--soft)}
.nc b{font:700 18px/1.2 var(--font-display)}
.nc span.s{color:var(--muted);font-size:13px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chip{background:var(--soft);color:var(--acc);padding:2px 7px;border-radius:5px;font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:6px 11px;font:500 13px var(--font-body);cursor:pointer}
.pills button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--acc);padding:0;cursor:pointer;font:inherit;text-decoration:underline}
.src{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:14px}
.src a{color:var(--acc)}
.src small{display:block;color:var(--muted);margin-top:6px;font-size:12px}

/* pages */
.art{max-width:68ch;display:flex;flex-direction:column;gap:14px}
.art h1{font-size:34px}
.art p{margin:0}
.rtb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:var(--surface)}
.rtb button{font:600 12px var(--font-body);padding:5px 9px;min-width:34px;border:1px solid var(--line);border-radius:6px;background:var(--bg,#fff);color:var(--fg);cursor:pointer}
.rtb button:hover{border-color:var(--acc);color:var(--acc)}
.rte{display:block!important;max-width:none!important;border:1px solid var(--line);border-radius:0 0 7px 7px;padding:12px 14px;background:var(--surface);color:var(--fg);font:15px/1.6 var(--font-body);overflow:auto;max-height:70vh;outline:0;min-width:0}
.rte:focus{border-color:var(--acc)}
.rte>*+*{margin-top:12px}
.art h2{font-size:26px;margin-top:10px}
.art h3{font-size:21px;margin-top:6px;font-family:var(--font-display);line-height:1.2;margin-bottom:0}
.art h4{font-size:17px;font-family:var(--font-display);margin:4px 0 0}
.art ul,.art ol{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:8px}
.art blockquote{margin:0;padding:6px 14px;border-left:4px solid var(--acc);color:var(--muted)}
.art a{color:var(--acc)}
.art table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.art th,.art td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.art hr{border:0;border-top:1px solid var(--line);width:100%}
.art strong{font-weight:700}

/* docs */
.dl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dr:first-child{border-top:0}
.ty{font:600 11px var(--font-mono);background:var(--soft);color:var(--acc);padding:4px 7px;border-radius:5px;flex:none}
.dn{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-weight:500}
.ds{font:12px var(--font-mono);color:var(--muted)}
#modal .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
#modal .md{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:84vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#modal pre{white-space:pre-wrap;font:12px/1.5 var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
#modal img{border-radius:8px;border:1px solid var(--line);max-height:50vh;object-fit:contain}
.dlo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlo button{padding:16px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);cursor:pointer;font:600 15px var(--font-display);display:flex;flex-direction:column;gap:4px;align-items:center}
.dlo button small{font:400 12px var(--font-body);color:var(--muted)}
.dlo button:hover{border-color:var(--acc)}

/* footer */
.ft{background:var(--surface);border-top:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-wrap:wrap;gap:6px 20px}
.fl button,.fl a{background:none;border:0;color:var(--fg);font:500 13px var(--font-body);padding:2px 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.fl button:hover,.fl a:hover{text-decoration-color:var(--acc)}
.ft small{color:var(--muted);font-size:12px}

/* toasts & cookie */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;left:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;max-width:380px;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:9px;font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:ti .25s ease-out}
.toast.alert{border-left:5px solid var(--hot)}
.toast b{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;display:block;opacity:.7}
@keyframes ti{from{transform:translateY(-8px);opacity:0}}
#cookie .ck{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:40;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
#cookie p{margin:0;max-width:62ch}
#cookie a{color:var(--acc);cursor:pointer;text-decoration:underline}

/* admin */
.adm{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:600px}
.as{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.as h4{margin:4px 10px 10px;font:600 11px var(--font-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.as button{text-align:left;background:none;border:0;color:var(--fg);padding:9px 10px;border-radius:7px;font:500 14px var(--font-body);cursor:pointer;white-space:nowrap}
.as button:hover{background:var(--soft)}
.as button[aria-current=true]{background:var(--acc);color:var(--acc-fg)}
.ac{padding:20px;min-width:0;display:flex;flex-direction:column;gap:16px}
.ac h2{font-size:22px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lab{font:500 12px var(--font-body);color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;font:14px var(--font-body);padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
textarea{font:12px/1.5 var(--font-mono);resize:vertical;min-height:200px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row .f{flex:1 1 150px}
.row>img{width:84px;height:40px;object-fit:cover;border-radius:5px;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.edit2{display:grid;grid-template-columns:minmax(0,1fr) 192px;gap:16px;align-items:start}
pre.code{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--font-mono);overflow-x:auto;white-space:pre}
.login{max-width:360px;margin:48px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.login h2{font-size:26px}
.note{font:12px var(--font-mono);color:var(--muted)}
.err{color:var(--hot);font-size:13px;min-height:1.3em}
.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.pl{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer;font:500 13px var(--font-body)}
.pl button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.badge{font:600 10px var(--font-mono);color:var(--muted);margin-left:6px}
.scroll{overflow-x:auto}
.ck2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.ck2 li{display:flex;gap:8px}
.ck2 li::before{content:"\2713";color:var(--ok);font-weight:700}
.ck2 li.bad::before{content:"!";color:var(--hot)}
.cnt{font:11px var(--font-mono);color:var(--muted);text-align:right}

@media (max-width:760px){
  .burger{display:block}
  .nv{display:none;flex-direction:column;align-items:stretch;width:100%;margin:0}
  .nv.open{display:flex}
  .dm{position:static;box-shadow:none;margin:2px 0 4px 10px}
  .hero{aspect-ratio:2/1}
  .cap{padding:22px 12px 9px}.cap h3{font-size:15px}.cap p{font-size:12px;margin:2px 0 0}.hmeta{display:none}.ar{width:30px;height:30px}
  .edit2,.cols{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}
  .as{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .as h4{display:none}
  .ac{padding:16px}
  .art h1{font-size:28px}
  .edit2 .tb{width:192px}
  .edit2 .tb.pvbig{width:100%;height:520px;position:static}
}

/* article photo gallery, lightbox, video library, admin picture grid */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.gi{border:0;padding:0;background:var(--soft);border-radius:10px;overflow:hidden;cursor:zoom-in;aspect-ratio:2/1;display:block}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px;display:block}
.lb button{position:absolute;top:12px;right:12px;border:0;border-radius:50%;width:38px;height:38px;background:rgba(255,255,255,.9);font-size:20px;cursor:pointer}
.vp{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vth{position:relative;display:block;aspect-ratio:16/9;background:#000;overflow:hidden}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth i{position:absolute;left:50%;top:50%;width:54px;height:38px;margin:-19px 0 0 -27px;border-radius:10px;background:rgba(0,0,0,.72)}
.vth i:after{content:"";position:absolute;left:21px;top:11px;border-style:solid;border-width:8px 0 8px 14px;border-color:transparent transparent transparent #fff}
.nc:hover .vth i{background:#c00}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.pth{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.pth img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block;background:var(--soft)}
.pth figcaption{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px;font-size:12px}
.pth figcaption b{color:var(--acc)}
.slx{border-top:1px solid var(--line)}
.slx .row{border-top:0;padding-top:4px}

/* image gallery page, multi-platform video players, HTML update panel */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;align-items:start}
.gf{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.gi2{border:0;padding:0;background:var(--soft);cursor:zoom-in;aspect-ratio:4/3;display:block;width:100%;overflow:hidden}
.gi2 img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gi2:hover img{transform:scale(1.03)}
.gf figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.gf figcaption span{color:var(--muted);font-size:13px}
.gfil{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.gfil button{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.gfil button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.lb.glb img{max-height:calc(100% - 70px)}
.lb.glb .glc{position:absolute;left:0;right:0;bottom:0;padding:10px 64px;color:#fff;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:2px;cursor:default;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.lb.glb .glc span{opacity:.85;font-size:13px}.lb.glb .glc em{font-style:normal;opacity:.7;font-size:12px}
.lb .lbn{top:50%;right:auto;left:12px;transform:translateY(-50%);width:44px;height:44px;font-size:28px;line-height:1}
.lb .lbn.lbf{left:auto;right:12px}
.gadm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px}
.gac{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.gac img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--soft);display:block}
.vp.tall{aspect-ratio:auto;height:min(760px,calc(100vh - 120px));max-width:480px;margin-left:auto;margin-right:auto}
.vp video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.vph{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#0f2a24,#15803d);color:#fff;text-align:center}
.vph b{font-size:15px;letter-spacing:.04em;text-transform:uppercase;opacity:.9}

/* big live preview (admin HTML tool boxes) */
.edit2.pvb{grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr)}
.tb.pvbig{aspect-ratio:auto;max-width:none;width:100%;height:clamp(520px,80vh,780px);position:sticky;top:12px}
@media (max-width:1100px){.edit2.pvb{grid-template-columns:1fr}.tb.pvbig{position:relative;top:0;height:560px}}
.sb .btn{white-space:nowrap}.sb .btn[disabled]{opacity:.6;cursor:wait}
.sbchk{display:flex;gap:6px;align-items:center;color:inherit;font-size:13px;cursor:pointer}
.zadm{border:1px solid var(--acc);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--acc) 7%,var(--surface));font-size:13px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){
  .tt{animation:none}.tm{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}.tm::-webkit-scrollbar{display:none}.trk{transition:none}.toast{animation:none}
}

  'DHA Multan’s 2026 Safeguard Your Asset notice is aimed at plot owners. See what the heading covers and what to confirm before paying.',
  ['DHA Multan listed a notice in 2026 under the heading “Safeguard Your Asset at DHA Multan”. The heading speaks to plot owners who want to keep their holding in good standing with the authority. It sits alongside the other 2026 notice on this site about paying 50% for full relief.',

  ['The heading of this 2026 notice describes a two-part offer: pay 50% and receive 100% relief. The heading does not say which charge the relief applies to, so the first job is to read the full notice for the charge type, the cut-off date and any plot categories left out.',

  'A 2025 DHA Multan notice extended its 100% surcharge waiver until 31 October. Here is what a surcharge is and how to avoid missing the deadline.',
  ['A surcharge is the extra amount added to a payment that was not made on time. In 2025 DHA Multan announced that its 100% surcharge waiver was extended until 31 October, giving owners with overdue dues more time.',
   'An extension usually follows a deadline that has passed or is about to. Treat 31 October as the last day, not the target day, and pay early so a bank delay does not cost you the waiver.',

  ['This 2025 notice announced a further extension of the 100% surcharge waiver scheme. It is one of several surcharge notices DHA Multan published during the year, including the extension until 31 October and the notice announcing the scheme’s return.',

 A('extension-development-charges-waiver-early-construction','Extension in Development Charges Waiver Scheme on Early Construction','2025','Development charges',
  'A 2025 DHA Multan notice extended the development charges waiver for early construction. See what early construction means and what to confirm.',
  ['DHA Multan’s 2025 notice, “Extension in Development Charges Waiver Scheme on Early Construction”, gave owners more time to benefit from a waiver tied to building early.',

  'DHA Multan’s 2025 Azadi notice offered a 100% surcharge waiver. Learn the background and how to check your own eligibility.',
  ['Azadi is the Urdu word for freedom and the name many Pakistanis use for Independence Day on 14 August. DHA Multan’s 2025 notice, “Azadi Celebration with 100% Surcharge Waiver”, tied a full surcharge waiver to the occasion.',

 A('major-financial-relief','Major Financial Relief','2025','Relief scheme',
  'A 2025 DHA Multan notice announced major financial relief for plot owners. Read what the heading says and what to confirm in the full notice.',
  ['“Major Financial Relief” is the heading of a 2025 DHA Multan notice. The heading does not say which charges the relief applies to, so this page does not either.',

  'DHA Multan extended its development charges waiver scheme in 2025. See how this notice relates to the other waiver announcements.',

 A('eid-special-offer','Eid Special Offer','2025','Special offer',
  'DHA Multan published an Eid special offer notice in 2025. Find out how to read seasonal offers and confirm the terms before you pay.',
  ['DHA Multan issued an “Eid Special Offer” notice in 2025. The heading marks it as a seasonal promotion linked to the Eid holidays.',

  var fr=/<iframe[^>]*\ssrc\s*=\s*["']([^"']+)["']/i.exec(u);if(fr)u=fr[1].replace(/&amp;/g,'&');
  if(/^\/\//.test(u))u='https:'+u;

    if(mm&&tt)st=(+mm[1]||0)*3600+(+mm[2]||0)*60+(+mm[3]||0);
    return yt(id,st);
  }
  /* Facebook videos, reels and watch links (also the plugin/embed address from an embed code) */
  if(h==='facebook.com'||h==='fb.com'||h==='fb.watch'){
    var href=x.href;
    if(p==='/plugins/video.php'){
      href=q.get('href')||'';

  }

  if(h==='instagram.com'||h==='instagr.am'){

    var k=m[1]==='reels'?'reel':m[1];

  }

  if(h==='tiktok.com'){
    m=/\/video\/(\d{8,25})/.exec(p)||/^\/embed\/v2\/(\d{8,25})/.exec(p);if(!m)return null;
    return {p:'tiktok',embed:'https://www.tiktok.com/embed/v2/'+m[1],watch:/\/video\//.test(p)?'https://www.tiktok.com'+p:'https://www.tiktok.com/embed/v2/'+m[1],thumb:'',tall:true};
  }
  /* Vimeo */
  if(h==='vimeo.com'||h==='player.vimeo.com'){
    m=/^\/(?:video\/|(?:channels\/[\w-]+|groups\/[\w-]+\/videos|album\/\d+\/video)\/)?(\d{6,12})(?:\/([0-9a-f]{6,}))?\/?$/.exec(p);if(!m)return null;
    var hh=m[2]||q.get('h')||'';if(hh&&!/^[0-9a-f]{6,}$/.test(hh))hh='';

    return {p:'x',embed:'https://platform.twitter.com/embed/Tweet.html?dnt=true&id='+m[1],watch:'https://x.com/i/status/'+m[1],thumb:'',tall:true};

  if(h==='dailymotion.com'||h==='dai.ly'){

    return {p:'dailymotion',embed:'https://www.dailymotion.com/embed/video/'+m[1],watch:'https://www.dailymotion.com/video/'+m[1],thumb:'https://www.dailymotion.com/thumbnail/video/'+m[1]};
  }
  /* Twitch videos and clips (Twitch needs the site's own address as "parent") */

    if(vm)return {p:'twitch',embed:'https://player.twitch.tv/?autoplay=false&video=v'+vm[1]+par,watch:'https://www.twitch.tv/videos/'+vm[1],thumb:''};
    var cm=h==='clips.twitch.tv'?/^\/([\w-]{4,100})/.exec(p):/^\/\w+\/clip\/([\w-]{4,100})/.exec(p);
    if(cm)return {p:'twitch',embed:'https://clips.twitch.tv/embed?autoplay=false&clip='+cm[1]+par,watch:'https://clips.twitch.tv/'+cm[1],thumb:''};
    return null;
  }
  /* a video file on any https address */
  if(x.protocol==='https:'&&/\.(mp4|webm|ogv|mov|m4v)$/i.test(p))return {p:'file',file:true,src:x.href,watch:x.href,thumb:''};
  return null;
}

const RT_OK=new Set(['P','H2','H3','H4','UL','OL','LI','BR','BLOCKQUOTE','STRONG','EM','U','S','A','TABLE','THEAD','TBODY','TR','TH','TD','HR','CODE','SUP','SUB']);
const RT_DROP=/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE|SVG|MATH|FORM|INPUT|BUTTON|SELECT|TEXTAREA|HEAD|META|LINK|TITLE|IMG|PICTURE|VIDEO|AUDIO|CANVAS)$/;

const rtCache=new Map();
function rtClean(html){
  html=String(html||'');if(!html.trim())return '';

  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');

  const walk=(src,dst)=>{
    src.childNodes.forEach(n=>{
      if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue.replace(/[\s\u00a0]+/g,' ')));return}
      if(n.nodeType!==1)return;
      let tag=n.tagName;
      if(RT_DROP.test(tag))return;
      const st=(n.getAttribute('style')||'').toLowerCase();
      if(tag==='B'||tag==='I'){

        tag=tag==='B'?'STRONG':'EM';

        const a=document.createElement('a');a.setAttribute('href',h);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');
        walk(n,a);dst.appendChild(a);return;
      }
      if(RT_OK.has(tag)){
        if(tag==='BR'||tag==='HR'){dst.appendChild(document.createElement(tag.toLowerCase()));return}
        const el=document.createElement(tag.toLowerCase());walk(n,el);dst.appendChild(el);return;
      }

      let t=dst;

      if(/font-style:\s*italic/.test(st)){const e=document.createElement('em');t.appendChild(e);t=e}

    else{if(!run){run=document.createElement('p');out.appendChild(run)}run.appendChild(n)}
  });

  const trim=el=>{
    for(let g=0;g<50;g++){
      const f=el.firstChild;if(!f)break;
      if(f.nodeType===3){const v=f.nodeValue.replace(/^\s+/,'');if(v){f.nodeValue=v;break}el.removeChild(f)}
      else if(f.nodeName==='BR')el.removeChild(f);else break;
    }

      const l=el.lastChild;if(!l)break;
      if(l.nodeType===3){const v=l.nodeValue.replace(/\s+$/,'');if(v){l.nodeValue=v;break}el.removeChild(l)}
      else if(l.nodeName==='BR')el.removeChild(l);else break;
    }

  const res=out.innerHTML;
  if(rtCache.size>200)rtCache.clear();
  rtCache.set(html,res);return res;
}

/* ---------- hero slider behaviour ---------- */
let timer=null,cur=0;
let HERO_VIS=false;
function mountHero(){
  const el=$('#hero');if(!el)return;
  const n=S.slides.length,trk=$('.trk',el),sls=$$('.sl',el),p=P();let paused=false,x0=null;
  cur=Math.min(cur,n-1);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,saver=!!(navigator.connection&&navigator.connection.saveData),small=matchMedia('(max-width:760px)').matches;
  /* phones, Data Saver and reduced motion get the still poster instead of downloading a video */
  const still=v=>{const im=new Image();im.src=v.poster||'';im.alt=v.getAttribute('aria-label')||'';im.decoding='async';v.replaceWith(im)};
  $$('video',el).forEach(v=>{if(reduced||saver||(small&&!p.heroVidMobile))still(v);else{v.addEventListener('error',()=>still(v),{once:true});v.addEventListener('loadedmetadata',()=>{if($('video',sls[cur])===v)tick()})}});
  const play=()=>sls.forEach((s,j)=>{const v=$('video',s);if(!v)return;if(j===cur){try{v.currentTime=0}catch(_){}const q=v.play();if(q&&q.catch)q.catch(()=>{})}else v.pause()});
  const go=i=>{cur=(i+n)%n;trk.style.transform=`translateX(-${cur*100}%)`;$$('.dot',el).forEach((d,j)=>d.setAttribute('aria-current',j===cur));play()};
  /* a video slide stays up until the video ends (at most 30 s) */
  const tick=()=>{clearTimeout(timer);if(n<2||reduced)return;const v=$('video',sls[cur]);let d=S.delay;if(v&&isFinite(v.duration)&&v.duration>0)d=Math.max(d,Math.min(v.duration*1000,30000));timer=setTimeout(()=>{if(!paused&&!document.hidden)go(cur+1);tick()},d)};
  el._go=i=>{go(i);tick()};go(cur);tick();
  el.addEventListener('mouseenter',()=>paused=true);el.addEventListener('mouseleave',()=>paused=false);
  el.addEventListener('focusin',()=>paused=true);el.addEventListener('focusout',()=>paused=false);
  el.addEventListener('pointerdown',e=>{x0=e.clientX});
  let moved=0;el.addEventListener('click',e=>{if(moved>10){e.preventDefault();e.stopPropagation()}moved=0},true);
  el.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;moved=Math.abs(dx);if(Math.abs(dx)>40)el._go(cur+(dx<0?1:-1))});
  if(!HERO_VIS){HERO_VIS=true;document.addEventListener('visibilitychange',()=>{const e=$('#hero');if(!e||!P().pauseHidden)return;const v=$('video',$$('.sl',e)[cur]);if(!v)return;if(document.hidden)v.pause();else{const q=v.play();if(q&&q.catch)q.catch(()=>{})}})}
}

/* ---------- ZIP admin-panel analysis ----------
   After a ZIP is extracted we look for an admin panel inside it (admin.html, admin/index.html, admin-panel.html ...).
   If one is found it is kept OFF the public tool page and opens only at /tools/<tool>/admin after signing in.
   A tool that has its own "Admin" tab inside a single page is handled too: the tab is hidden for visitors. */
const ADM_DIR=/^(admin|administrator|backend|backoffice|cpanel)$/i;
const ADM_FILE=/^(admin|administrator|backend|backoffice|cpanel)([-_. ].*)?$|(^|[-_. ])admin([-_. ]|$)|adminpanel/i;
const ADM_INPAGE=/<(?:button|a|li|div|span)\b[^>]*>(?:[^\w<>]|<[^>]+>)*admin(?:\s+panel)?\s*<\/(?:button|a|li|div|span)>|data-(?:tab|view|page)=["']admin["']|role=["']tab["'][^>]*>\s*admin\s*</i;
function zIsAdminPath(p){
  const segs=p.split('/'),base=segs[segs.length-1].replace(/\.[^.]+$/,'');
  return segs.slice(0,-1).some(x=>ADM_DIR.test(x))||ADM_FILE.test(base);
}
function zipAnalyze(files,htmls,entry){
  const adm=htmls.filter(zIsAdminPath),pub=htmls.filter(p=>!zIsAdminPath(p));
  const out={entry,htmls,admin:null,inpage:false};
  if(adm.length&&pub.length){
    const rank=p=>{const sg=p.split('/'),n=sg[sg.length-1].toLowerCase();return (/^index\.html?$/.test(n)?0:/^admin\.html?$/.test(n)?1:2)*20+sg.length};
    adm.sort((x,y)=>rank(x)-rank(y)||x.localeCompare(y));
    const dirs=[...new Set(adm.map(p=>{const sg=p.split('/');for(let i=0;i<sg.length-1;i++)if(ADM_DIR.test(sg[i]))return sg.slice(0,i+1).join('/')+'/';return ''}).filter(Boolean))];
    out.admin={entry:adm[0],paths:adm.slice(0,50),dirs:dirs.slice(0,10)};
    out.htmls=pub;
    if(zIsAdminPath(entry))out.entry=pub.find(p=>p==='index.html')||pub.find(p=>/(^|\/)index\.html?$/i.test(p))||pub[0];
  }
  try{const f=files.find(x=>x.p===out.entry);if(f&&ADM_INPAGE.test(new TextDecoder().decode(f.u8.subarray(0,500000))))out.inpage=true}catch(_){}
  return out;
}

  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(new Error('Could not read '+file.name+'.'));

/* Compress a video in the browser: play it into a smaller canvas and record the result.
   Runs at normal playing speed, so a 30 s clip takes about 30 s. No sound track is kept (hero videos are muted). */
async function optVideo(src,o,prog){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('This browser cannot compress video. Use Chrome or Edge on a computer.');
  const url=URL.createObjectURL(src),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error('This browser cannot read that video (try an MP4 with H.264).'))});
    if(v.duration>180)throw new Error('The clip is longer than 3 minutes. Use a shorter clip for the hero slider.');
    const k=Math.min(1,o.maxW/v.videoWidth),w=Math.max(2,Math.round(v.videoWidth*k/2)*2),h=Math.max(2,Math.round(v.videoHeight*k/2)*2);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const mt=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    if(!mt)throw new Error('This browser has no video recorder format available.');
    const rec=new MediaRecorder(c.captureStream(30),{mimeType:mt,videoBitsPerSecond:o.kbps*1000}),parts=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
    const stopped=new Promise(r=>{rec.onstop=r});
    let fin=false;
    const draw=()=>{if(fin)return;x.drawImage(v,0,0,w,h);if(prog&&v.duration)prog(v.currentTime/v.duration);if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw)};
    v.onended=()=>{fin=true;setTimeout(()=>rec.stop(),150)};
    rec.start(1000);await v.play();draw();await stopped;
    return new Blob(parts,{type:mt.split(';')[0]});
  }finally{URL.revokeObjectURL(url)}
}

  if(t.dataset.vchk){const vv=S.vids[Math.min(S.ui.vi||0,S.vids.length-1)];const pv=document.getElementById('vprev');if(pv&&vv)pv.innerHTML=vPrev(vv)}
  if(t.dataset.vslug){const vv=S.vids[Math.min(S.ui.vi||0,S.vids.length-1)];if(vv)vv.auto=false}
  if(t.dataset.vtitle){const vv=S.vids[Math.min(S.ui.vi||0,S.vids.length-1)];if(vv&&vv.auto){vv.slug=uniqVidSlug(slug(v).replace(/-+$/,'')||'video',vv);const el=document.getElementById('vs');if(el)el.value=vv.slug}}
  if(t.dataset.col)applyAccent();
  if(t.dataset.live){const n=document.getElementById(t.dataset.live);if(n)n.textContent=v}
  if(t.dataset.pv){clearTimeout(pvT);pvT=setTimeout(()=>fillFrames('#pvf'),300)}
  if(t.dataset.seo||/^(seo\.|title)/.test(t.dataset.b))refreshSeo();
  if(t.dataset.aseo||/^(seo\.|title)/.test(t.dataset.b))refreshArt();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='autosave'){AUTOSAVE=t.checked;LS.set('maskan_autosave',AUTOSAVE?'1':'0');if(AUTOSAVE&&snap()!==SAVED){clearTimeout(syncT);syncT=setTimeout(autoSync,300)}updateSaveBar();return}
  if(t.id==='inl'){S.inline=t.checked;S.view='site';render();return}
  if(t.type==='checkbox'&&t.dataset.b){setPath(t.dataset.b,t.checked);refreshSeo();refreshArt()}
  if(t.dataset.rr&&t.dataset.b){render();return}
  if(t.dataset.srep!==undefined&&t.files&&t.files[0]){const f=t.files[0],k=+t.dataset.srep;t.value='';replaceSlidePic(k,f);return}
  if(t.id==='box-file'&&t.files[0]){
    const f=t.files[0],r=new FileReader(),b=S.boxes[S.ui.sel],isImg=f.type.startsWith('image/');
    toast('Reading '+f.name+'...');
    r.onerror=()=>toast('Could not read that file. Try another one.');
    if(f.size>(isImg?1500000:500000)){toast(isImg?'Image is over 1.5 MB. Pick a smaller photo.':'File is over 500 KB. Pick a smaller file.');t.value='';return}
    r.onload=()=>{
      if(b.zip){delete b.zip;ZIP_DIRTY=true}
      b.code=isImg?`<style>html,body{margin:0;height:100%}img{width:100%;height:100%;object-fit:cover;display:block}</style><img src="${r.result}" alt="${esc(b.title)}">`:String(r.result);
      render();toast(isImg?'Photo placed in the box.':'HTML loaded into the box.');
    };
    if(isImg)r.readAsDataURL(f);else r.readAsText(f);
  }
  if(t.id==='box-upd'&&t.files[0]){
    const f=t.files[0];t.value='';
    if(!/\.html?$/i.test(f.name)&&!/html/i.test(f.type)){toast('Choose an .html or .htm file.');return}
    if(f.size>500000){toast('File is over 500 KB. Pick a smaller file, or use Upload ZIP File for bigger tools.');return}
    const r=new FileReader();r.onerror=()=>toast('Could not read that file. Try another one.');
    r.onload=()=>{S.ui.upd={i:S.ui.sel,name:f.name,code:String(r.result)};render();toast('Check the changes below, then press Apply update.');const pn=document.getElementById('updpanel');if(pn&&pn.scrollIntoView)pn.scrollIntoView({block:'center',behavior:'smooth'})};
    r.readAsText(f);return;
  }
  if(t.id==='gal-img'&&t.files.length){const fs=[...t.files];t.value='';addGalPics(fs);return}
  if(t.id==='vthumb-file'&&t.files[0]){const f=t.files[0];t.value='';vidCover(f);return}
  if(t.id==='pzip-file'&&t.files[0]){const f=t.files[0];t.value='';zipUpload(f,'page');return}
  if(t.id==='pzent'){const p=S.pages[S.ui.pg];if(p&&p.zip&&p.zip.htmls.includes(t.value)){p.zip.entry=t.value;render()}return}
  if(t.id==='logo-file'&&t.files[0]){const f=t.files[0];t.value='';logoUpload(f);return}
  if(t.id==='zip-file'&&t.files[0]){const f=t.files[0];t.value='';zipUpload(f);return}
  if(t.id==='zent'){const b=S.boxes[S.ui.sel];if(b.zip&&b.zip.htmls.includes(t.value)){b.zip.entry=t.value;render()}return}
  if(t.id==='svid-file'&&t.files[0]){const f=t.files[0];t.value='';slideVideo(f);return}
  if(t.id==='vopt'){S.ui.vopt=t.checked;return}
  if(t.id==='sup-file'&&t.files.length){const fs=[...t.files];t.value='';addSlidePics(fs);return}
  if(t.id==='doc-file'&&t.files.length){
    [...t.files].forEach(f=>{
      const n=f.name.toLowerCase(),isImg=f.type.startsWith('image/'),ext=isImg?'IMG':n.endsWith('.pdf')?'PDF':(n.endsWith('.doc')||n.endsWith('.docx'))?'DOC':n.endsWith('.txt')?'TXT':(n.split('.').pop()||'FILE').toUpperCase();
      const size=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB';
      if(f.size>2500000){toast(f.name+' is over 2.5 MB. Pick a smaller file.');return}
      const r=new FileReader();
      r.onerror=()=>toast('Could not read '+f.name+'.');
      r.onload=()=>{const d={id:newDocId(),name:f.name,type:ext,size,text:'',url:r.result};
        if(ext==='TXT'){try{d.text=decodeURIComponent(escape(atob(r.result.split(',')[1])))}catch(_){}}
        S.docs.push(d);render();toast('Document added.')};
      r.readAsDataURL(f);
    });
    t.value='';
  }
  if(t.id==='art-img'&&t.files.length){const fs=[...t.files];t.value='';addArtPics(fs);return}
});
function feed(files,e){
  const id=(S.sec==='pages'&&files[0]&&/\.zip$/i.test(files[0].name))?'pzip-file':(S.sec==='tools'&&files[0]&&/\.zip$/i.test(files[0].name))?'zip-file':(S.sec==='slider'&&files[0]&&(/^video\//.test(files[0].type)||/\.(mp4|webm|mov|m4v)$/i.test(files[0].name)))?'svid-file':{tools:'box-file',docs:'doc-file',slider:'sup-file',arts:'art-img',gal:'gal-img'}[S.sec],inp=id&&document.getElementById(id);
  if(!inp)return;
  if(!files.length){const tx=e&&e.clipboardData&&e.clipboardData.getData('text');
    if(S.sec==='tools'&&tx){if(S.boxes[S.ui.sel].zip){delete S.boxes[S.ui.sel].zip;ZIP_DIRTY=true}S.boxes[S.ui.sel].code=tx;render();toast('Pasted code placed in the box.')}else toast('Nothing to paste. Copy a photo or file first.');return}
  try{const dt=new DataTransfer();(inp.multiple?files:[files[0]]).forEach(f=>dt.items.add(f));inp.files=dt.files;inp.dispatchEvent(new Event('change',{bubbles:true}))}
  catch(_){toast('This browser cannot accept pasted or dropped files.')}
}
document.addEventListener('paste',e=>{
  if(S.view!=='admin'||!S.admin||!e.target.closest||!e.target.closest('[data-zone]'))return;
  e.preventDefault();feed([...(e.clipboardData?.files||[])],e);e.target.closest('[data-zone]').textContent=e.target.closest('[data-zone]').dataset.t||e.target.closest('[data-zone]').textContent;
});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-zone]'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('[data-zone]')){e.preventDefault();feed([...e.dataTransfer.files],e)}});
document.addEventListener('beforeinput',e=>{if(e.target.closest&&e.target.closest('[data-zone]')&&e.inputType!=='insertFromPaste')e.preventDefault()});
/* ---------- username + password sign-in ---------- */
document.addEventListener('submit',e=>{if(e.target&&e.target.dataset&&e.target.dataset.lform){e.preventDefault();doLogin()}});
async function doLogin(){
  const err=document.getElementById('lerr'),u=($('#lu').value||'').trim(),p=$('#lp').value||'';
  if(!u||!p){if(err)err.textContent='Enter your username and password.';return}
  if(err)err.textContent='Signing in\u2026';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',user:u,pass:p})});
    let j={};try{j=await r.json()}catch(e){}
    if(r.ok&&j.token){setAuth(j.token);S.admin=true;S.user=j.user||'';S.role=j.role||'owner';render();toast('Signed in.');if(snap()!==SAVED)autoSync();return}
    const m=r.status===429?'Too many attempts. Try again in '+Math.ceil((j.wait||900000)/60000)+' minutes.':'Wrong username or password.';
    const e2=document.getElementById('lerr');if(e2)e2.textContent=m;
  }catch(e){const e2=document.getElementById('lerr');if(e2)e2.textContent='Could not reach the server. Check your connection.'}
}
/* the tool boxes' own admin tabs: they are open whenever the owner is already signed in */
async function siteLogin(){return !!(S.admin&&(AUTH||STATIC_COPY))}
async function logoUpload(f){
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('Choose a PNG, JPG or WebP picture.');return}
  if(!AUTH){toast('Please sign in again to upload.');return}
  try{
    const url=URL.createObjectURL(f),im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('That picture could not be read.'));i.src=url});
    const k=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw new Error('Could not prepare the picture.');
    toast('Uploading logo\u2026');
    const it=await mdUploadBlob(blob,'logo.png');
    S.logoImg=it.url;render();toast('Logo updated. Publishing\u2026');
    if(Math.min(im.width,im.height)<192)toast('Tip: this picture is small ('+im.width+' x '+im.height+'). A 512 x 512 logo looks sharper and Google prefers at least 192 x 192.');
  }catch(e){if(e.message!=='auth')toast('Logo upload failed: '+(e&&e.message||'error'))}
}
async function setCred(){
  const u=$('#nu').value.trim(),p=$('#np1').value,c=$('#np2').value,err=$('#aerr');
  if(u.length<4){err.textContent='Username needs at least 4 characters.';return}
  if(p.length<10){err.textContent='Password needs at least 10 characters.';return}
  if(p!==c){err.textContent='The two passwords do not match.';return}
  const cu=$('#cu').value.trim(),cp=$('#cp').value;
  if(!cu||!cp){err.textContent='Enter your current username and password to confirm.';return}
  err.textContent='Saving…';
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':AUTH||''},body:JSON.stringify({action:'setcred',currentUser:cu,currentPass:cp,newUser:u,newPass:p})});
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===401){signedOut('Session expired. Please sign in again.');return}
    if(!r.ok||!j.ok){err.textContent=j.error||('Could not save (error '+r.status+').');return}
  }catch(e){err.textContent='Could not reach the server. Nothing was changed.';return}
  err.textContent='';['nu','np1','np2','cu','cp'].forEach(id=>{const x=$('#'+id);if(x)x.value=''});toast('Credentials updated. Other devices have been signed out.');
}
document.addEventListener('focusout',e=>{const h=e.target.closest&&e.target.closest('.tool h3[contenteditable]');if(h){const v=h.textContent.trim()||'Untitled';S.boxes[+h.dataset.i].title=v;h.textContent=v;toast('Heading saved.')}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.tool h3[contenteditable]')){e.preventDefault();e.target.blur()}
  if(e.key==='Escape'&&S.ui.doc!==null){S.ui.doc=null;renderModal()}
});
new MutationObserver(()=>render()).observe(root,{attributes:true,attributeFilter:['data-theme']});

window.addEventListener('popstate',()=>{syncFromURL();render()});
window.addEventListener('message',e=>{
  const d=e.data,f=$$('.tfull iframe,#bpf').find(x=>e.source===x.contentWindow);
  if(!f||!d||typeof d.type!=='string')return;
  if(f.dataset.zip&&!/^(toolsub|store-get|store-set)$/.test(d.type))return;
  if(d.type==='toolsub'&&typeof d.sub==='string'){
    if(f.id==='bpf')return;
    const sub=slug(d.sub).replace(/-+$/,'').slice(0,40);
    if(sub===S.sub)return;
    S.sub=sub;pushURL(urlFor(S.route,sub));return;
  }
  if(d.type==='fetch'){
    const reply=o=>f.contentWindow&&f.contentWindow.postMessage({type:'fetch-res',id:d.id,...o},'*');
    let u;try{u=new URL(d.url,location.href)}catch(x){reply({error:'Bad URL'});return}
    if(!/^https?:$/.test(u.protocol)){reply({error:'Blocked URL'});return}
    const m=String(d.method||'GET').toUpperCase(),body=(m==='GET'||m==='HEAD')?undefined:d.body;
    fetch(u.href,{method:m,headers:d.headers||{},body}).then(async r=>reply({status:r.status,statusText:r.statusText,headers:[...r.headers.entries()],body:await r.text()})).catch(x=>reply({error:'Network error'}));
    return;
  }
  if(d.type==='site-login'){
    siteLogin(d.user,d.pass).then(ok=>f.contentWindow&&f.contentWindow.postMessage({type:'store-res',id:d.id,ok},'*'));
    return;
  }
  if(d.type==='store-get'||d.type==='store-set'){
    const tool=pathOf(f.id==='bpf'?'t:'+f.dataset.i:S.route).split('/')[2]||'',reply=o=>f.contentWindow&&f.contentWindow.postMessage({type:'store-res',id:d.id,...o},'*');
    if(d.type==='store-get'){fetch('/api/tool-data?tool='+encodeURIComponent(tool)+'&'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>reply({ok:!!j,data:j&&j.data})).catch(()=>reply({ok:false}));return}
    if(!S.admin||!AUTH||(S.sub!=='admin'&&!f.dataset.adm)){reply({ok:false});return}
    fetch('/api/tool-data',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':AUTH},body:JSON.stringify({tool,data:d.data})}).then(r=>reply({ok:r.ok})).catch(()=>reply({ok:false}));
  }
});
if(BOOT&&BOOT.data){applyData(BOOT.data);REMOTE_AT=LASTSAVE=BOOT.savedAt||0;SAVED=snap()}
syncFromURL();render();boot();
</script>
